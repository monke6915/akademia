<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__NAME__ CV</title>
<style>
__FONTS__
@font-face{font-family:'Source Serif 4';src:url(__SERIF_LAT__) format('woff2');font-weight:200 900;font-style:normal;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Source Serif 4';src:url(__SERIF_EXT__) format('woff2');font-weight:200 900;font-style:normal;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

/* ---- One scalable unit ------------------------------------------------
   Every type size and every vertical gap is a multiple of --fs, so the
   auto-fit in build.py can resize the whole page by changing one number
   without touching the proportions.                                      */
:root{
  --fs:__FS__pt; --u:var(--fs);
  --paper:#FAF9F6; --ink:#14181E; --muted:#585D65; --faint:#858B94;
  --rule:#DFDCD4; --hair:#EAE7E0; --accent:__ACCENT__;
  --pad:15mm; --rail:30mm; --gut:8mm;
}
*{box-sizing:border-box;margin:0;padding:0}
@page{size:A4;margin:0}
body{
  width:210mm; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif; font-size:var(--fs); line-height:1.5;
  -webkit-font-smoothing:antialiased; font-feature-settings:"kern" 1,"liga" 1;
}
.page{width:210mm; min-height:297mm; padding:var(--pad) var(--pad) 13mm}

/* ---- Masthead: name left, coordinates right, heavy rule beneath -------- */
.mast{display:flex; justify-content:space-between; align-items:flex-end; gap:10mm}
.name{
  font-family:'IBM Plex Serif',serif; font-weight:400;
  font-size:calc(var(--fs)*4.05); line-height:.98; letter-spacing:-.022em;
}
.coords{
  text-align:right; font-size:calc(var(--fs)*.95); line-height:1.62;
  color:var(--muted); padding-bottom:calc(var(--u)*.5);
}
.coords a{color:var(--muted); text-decoration:none}
.coords .sep{color:var(--rule); padding:0 1.2mm}
hr.heavy{border:0; border-top:1.4pt solid var(--ink); margin-top:calc(var(--u)*1.15)}

/* ---- Lede: headline + standfirst, set wide like a magazine deck -------- */
.lede{
  padding:calc(var(--u)*2.1) 0 calc(var(--u)*2.4);
  display:grid; grid-template-columns:var(--rail) 1fr; gap:0 var(--gut);
}
.kicker{
  font-family:'IBM Plex Serif',serif; font-weight:400;
  font-size:calc(var(--fs)*1.36); line-height:1.15; letter-spacing:-.004em;
  padding-top:calc(var(--u)*.5);
}
.role{font-size:calc(var(--fs)*1.72); font-weight:500; letter-spacing:-.02em; line-height:1.24}
.summary{
  margin-top:calc(var(--u)*1.35); max-width:132mm;
  font-size:calc(var(--fs)*1.07); line-height:1.68; color:var(--muted);
}

/* ---- Sections hang off a left rail ------------------------------------ */
section{
  display:grid; grid-template-columns:var(--rail) 1fr; gap:0 var(--gut);
  border-top:.6pt solid var(--rule);
  padding:calc(var(--u)*1.45) 0 calc(var(--u)*1.95);
}
section:last-of-type{padding-bottom:0}
.rail{padding-top:calc(var(--u)*.12)}
.rail h2{
  font-family:'IBM Plex Serif',serif; font-weight:400;
  font-size:calc(var(--fs)*1.36); line-height:1.15; letter-spacing:-.004em;
}

/* ---- Timeline rows: title left, dates hard right ---------------------- */
.row{padding-bottom:calc(var(--u)*1.35)}
.row:last-child{padding-bottom:0}
.row + .row{border-top:.6pt solid var(--hair); padding-top:calc(var(--u)*1.15)}
.rowhd{display:flex; justify-content:space-between; align-items:baseline; gap:6mm}
.title{font-size:calc(var(--fs)*1.15); font-weight:600; letter-spacing:-.014em; line-height:1.25}
.when{font-family:'IBM Plex Mono',monospace; font-size:calc(var(--fs)*.8); color:var(--faint); white-space:nowrap; font-variant-numeric:tabular-nums}
.org{font-size:calc(var(--fs)*1.03); color:var(--muted); margin-top:calc(var(--u)*.12)}
.detail{
  font-size:calc(var(--fs)*.97); color:var(--muted); line-height:1.58;
  margin-top:calc(var(--u)*.58); max-width:124mm;
}

/* ---- Credit lines: name + note left, result hard right ---------------- */
.line{display:flex; justify-content:space-between; align-items:baseline; gap:6mm; padding:calc(var(--u)*.78) 0}
.line:first-child{padding-top:0}
.line:last-child{padding-bottom:0}
.line + .line{border-top:.6pt solid var(--hair)}
.line .nm{font-size:calc(var(--fs)*1.03); font-weight:600; letter-spacing:-.01em}
.line .note{font-size:calc(var(--fs)*.97); color:var(--muted); margin-top:calc(var(--u)*.1)}
.line .tag{font-family:'IBM Plex Mono',monospace; font-size:calc(var(--fs)*.8); color:var(--accent); white-space:nowrap; font-weight:500}

/* ---- Closing band: skills and languages share one rule --------------- */
.split{display:grid; grid-template-columns:1fr auto 38mm; gap:0 7mm}
.split .divider{border-left:.6pt solid var(--hair)}
.split h3{
  font-family:'IBM Plex Mono',monospace; font-size:calc(var(--fs)*.92); font-weight:500;
  letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  margin-bottom:calc(var(--u)*1);
}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:calc(var(--u)*1.15) 7mm}
.groups{column-count:2; column-gap:7mm}
.grp{break-inside:avoid; margin-bottom:calc(var(--u)*1.5)}
.grp:last-child{margin-bottom:0}
.grp h4{
  font-family:'IBM Plex Mono',monospace; font-size:calc(var(--fs)*.92); font-weight:500;
  letter-spacing:.04em; text-transform:uppercase; color:var(--accent);
  margin-bottom:calc(var(--u)*.65);
}
.grp .cell + .cell{margin-top:calc(var(--u)*.5)}
.cell .nm{font-size:calc(var(--fs)*1.09); font-weight:600; letter-spacing:-.01em}
.cell .lv{font-size:calc(var(--fs)*1); color:var(--muted); margin-top:calc(var(--u)*.1)}
.stack .cell + .cell{margin-top:calc(var(--u)*1.15)}

/* one date slot per layout */
.row > .when{display:none}
</style>
</head>
<body>
<div class="page">

  <header class="mast">
    <h1 class="name">__NAME__</h1>
    <div class="coords">__COORDS__</div>
  </header>
  <hr class="heavy">

  <div class="lede">
    <div class="kicker">Profile</div>
    <div>
      <p class="role">__ROLE__</p>
      <p class="summary">__SUMMARY__</p>
    </div>
  </div>

  __SECTIONS__

</div>
</body>
</html>
