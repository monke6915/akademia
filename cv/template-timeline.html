<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__NAME__ — CV</title>
<style>
__FONTS__
:root{
  --fs:__FS__pt; --u:var(--fs);
  --paper:#FBFAF7; --ink:#14181E; --muted:#585D65; --faint:#9AA0A8;
  --rule:#DCD8CE; --hair:#E9E5DC; --accent:__ACCENT__;
  --spine:26mm; --pad:15mm;
}
*{box-sizing:border-box;margin:0;padding:0}
@page{size:A4;margin:0}
body{
  width:210mm; background:var(--paper); color:var(--ink);
  font-family:'Inter',sans-serif; font-size:var(--fs); line-height:1.5;
  -webkit-font-smoothing:antialiased; font-feature-settings:"kern" 1,"liga" 1;
}
.page{width:210mm; min-height:297mm; padding:var(--pad) var(--pad) 12mm}

/* ---- Head: name over a centred rule, details ranged beneath ----------- */
.head{text-align:center; padding-bottom:calc(var(--u)*1.5); border-bottom:.6pt solid var(--rule)}
.name{
  font-family:'Source Serif 4',serif; font-weight:400;
  font-size:calc(var(--fs)*4.6); line-height:1; letter-spacing:-.02em;
}
.role{
  font-size:calc(var(--fs)*1.05); font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent); margin-top:calc(var(--u)*.95);
}
.coords{
  font-size:calc(var(--fs)*.94); color:var(--muted); margin-top:calc(var(--u)*1.1);
}
.coords a{color:var(--muted); text-decoration:none}
.coords .sep{color:var(--rule); padding:0 2mm}
.summary{
  max-width:148mm; margin:calc(var(--u)*1.7) auto 0; text-align:center;
  font-size:calc(var(--fs)*1.05); line-height:1.68; color:var(--muted);
}

/* ---- Section headings sit on the spine's axis ------------------------- */
h2{
  font-family:'Source Serif 4',serif; font-weight:400;
  font-size:calc(var(--fs)*1.5); line-height:1.15;
  margin:calc(var(--u)*2.3) 0 calc(var(--u)*1.25);
}
section:first-of-type h2{margin-top:calc(var(--u)*2)}

/* ---- The spine: a hairline with accent nodes at every entry ----------- */
.row{display:grid; grid-template-columns:var(--spine) 1fr; gap:0 6mm; position:relative}
.row .when{
  text-align:right; padding-right:6mm; padding-top:calc(var(--u)*.06);
  font-size:calc(var(--fs)*.86); line-height:1.42; color:var(--faint);
  font-variant-numeric:tabular-nums;
}
.row .content{
  border-left:.6pt solid var(--rule); padding:0 0 calc(var(--u)*1.55) 7mm;
  position:relative;
}
.row:last-child .content{padding-bottom:calc(var(--u)*.3)}
.row .content::before{
  content:''; position:absolute; left:-1.55pt; top:calc(var(--u)*.42);
  width:3.1pt; height:3.1pt; border-radius:50%; background:var(--accent);
}
.title{font-size:calc(var(--fs)*1.15); font-weight:600; letter-spacing:-.014em; line-height:1.25}
.org{font-size:calc(var(--fs)*1.02); color:var(--muted); margin-top:calc(var(--u)*.1)}
.detail{font-size:calc(var(--fs)*.96); color:var(--muted); line-height:1.58; margin-top:calc(var(--u)*.55); max-width:126mm}

/* ---- Closing band: three columns under one rule ----------------------- */
.band{
  display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:0 9mm;
  border-top:.6pt solid var(--rule); margin-top:calc(var(--u)*2.1); padding-top:calc(var(--u)*1.4);
}
.band h3{
  font-size:calc(var(--fs)*.8); font-weight:600; letter-spacing:.15em;
  text-transform:uppercase; color:var(--faint); margin-bottom:calc(var(--u)*1);
}
.cell + .cell{margin-top:calc(var(--u)*.95)}
.cell .nm{font-size:calc(var(--fs)*1.02); font-weight:600; letter-spacing:-.01em}
.cell .lv{font-size:calc(var(--fs)*.9); color:var(--faint); margin-top:calc(var(--u)*.08)}
.line{padding:calc(var(--u)*.6) 0}
.line:first-child{padding-top:0}
.line + .line{border-top:.6pt solid var(--hair)}
.line .nm{font-size:calc(var(--fs)*1.02); font-weight:600; letter-spacing:-.01em}
.line .note{font-size:calc(var(--fs)*.94); color:var(--muted); margin-top:calc(var(--u)*.08)}
.line .tag{font-size:calc(var(--fs)*.86); color:var(--accent); font-weight:500}

/* one date slot per layout */
.rowhd .when{display:none}
.rowhd{display:block}
</style>
</head>
<body>
<div class="page">

  <header class="head">
    <h1 class="name">__NAME__</h1>
    <p class="role">__ROLE__</p>
    <p class="coords">__COORDS_INLINE__</p>
    <p class="summary">__SUMMARY__</p>
  </header>

  <section><h2>Experience</h2>__EXPERIENCE__</section>
  <section><h2>Education</h2>__EDUCATION__</section>

  <div class="band">
    <div><h3>__PROJECTS_LABEL__</h3>__PROJECTS__</div>
    <div><h3>Skills</h3>__SKILLS__</div>
    <div><h3>Languages</h3>__LANGUAGES__</div>
  </div>

</div>
</body>
</html>
